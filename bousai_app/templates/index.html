{% extends "base.html" %}

{% block content %}
<div class="section-title">
  <span class="pin"></span>
  <span>避難所マップ</span>
</div>

<div class="map-card">
  <div id="shelterMap"></div>
</div>

<div class="weather-card">
  <div class="weather-header">
    <div class="weather-title">
      <span>☁</span>
      <span>青森市 気象警報・注意報</span>
    </div>
    <div class="weather-badge">10分おき自動更新</div>
  </div>

  <div id="weatherContent" class="weather-body">
    <div class="weather-status">
      <span class="status-dot"></span>
      <span>読み込み中...</span>
    </div>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap', { zoomControl: true, scrollWheelZoom: false }).setView([40.8244, 140.7400], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                updateWeatherContent(data);
            })
            .catch(() => {
                document.getElementById('weatherContent').innerHTML = `
                    <div class="weather-status"><span class="status-dot"></span><span>気象情報の取得に失敗しました</span></div>
                `;
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = `
                <div class="weather-status"><span class="status-dot"></span><span>気象情報の取得に失敗しました</span></div>
            `;
            return;
        }

        const areaName = data.area_name || '青森市';
        let warningsHtml = `
            <div class="weather-status">
              <span class="status-dot" style="background:#1d9d58; box-shadow:0 0 0 3px rgba(29,157,88,0.18);"></span>
              <span class="status-safe">現在、警報・注意報は発表されていません</span>
            </div>
        `;

        if (data.warnings && data.warnings.length > 0) {
            const alertText = data.warnings.map(w => w.name + '（' + w.status + '）').join(' / ');
            const isWarning = data.warnings.some(w => w.name.includes('警報'));
            const isAdvisory = data.warnings.some(w => w.name.includes('注意報'));
            const colorClass = isWarning ? 'status-warning' : isAdvisory ? 'status-advisory' : 'status-safe';
            const dotColor = isWarning ? '#d62828' : isAdvisory ? '#d79d00' : '#1d9d58';

            warningsHtml = `
                <div class="weather-status">
                  <span class="status-dot" style="background:${dotColor}; box-shadow:0 0 0 3px rgba(0,0,0,0.08);"></span>
                  <span class="${colorClass}">${alertText}</span>
                </div>
            `;
        }

        weatherContent.innerHTML = `
            <div class="weather-status">
              <span class="status-dot" style="background:#1d9d58; box-shadow:0 0 0 3px rgba(29,157,88,0.18);"></span>
              <span>${areaName}</span>
            </div>
            ${warningsHtml}
            <div class="small">⏱ データ取得時刻: ${data.last_fetch_time || '更新中...'}</div>
            <div class="small">⚐ 気象庁最終発表: ${data.report_time || '不明'}</div>
        `;
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
