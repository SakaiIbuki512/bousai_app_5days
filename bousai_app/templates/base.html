<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --header-blue: #0e5c8d;
      --header-blue-dark: #094b77;
      --panel-bg: #f4f6f8;
      --panel-border: #dfe5ea;
      --text-main: #1d2d3d;
      --text-sub: #58728a;
      --accent-blue: #1e88d9;
      --success-green: #2bb673;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Yu Gothic", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #efefef;
      color: var(--text-main);
    }

    .app-header {
      height: 72px;
      background: linear-gradient(180deg, var(--header-blue) 0%, var(--header-blue-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px 0 28px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .app-brand {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
      color: #fff;
      text-decoration: none;
    }

    .app-menu {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      position: relative;
      cursor: pointer;
    }

    .app-menu::before,
    .app-menu::after,
    .app-menu span {
      content: "";
      position: absolute;
      left: 10px;
      width: 18px;
      height: 2px;
      background: #fff;
      border-radius: 2px;
    }

    .app-menu::before { top: 12px; }
    .app-menu span { top: 18px; }
    .app-menu::after { top: 24px; }

    .top-nav {
      display: none;
    }

    main {
      max-width: 980px;
      margin: 28px auto 48px;
      padding: 0 18px;
    }

    .section-panel {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: 0 2px 10px var(--shadow);
      overflow: hidden;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .section-title .pin {
      width: 16px;
      height: 16px;
      display: inline-block;
      border-radius: 50%;
      background: var(--accent-blue);
      position: relative;
      box-shadow: inset 0 0 0 4px rgba(255,255,255,0.9);
    }

    .section-title .pin::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      width: 4px;
      height: 8px;
      background: var(--accent-blue);
      transform: translateX(-50%);
      border-radius: 0 0 3px 3px;
    }

    .map-card {
      background: #f4f6f8;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      padding: 16px 16px 0;
      margin-bottom: 28px;
    }

    #shelterMap {
      width: 100%;
      height: 420px;
      border-radius: 12px;
      overflow: hidden;
      background: #dfeff5;
    }

    .weather-card {
      background: #f3f6f8;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      padding: 18px 22px 14px;
    }

    .weather-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #dfe3e8;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .weather-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .weather-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--success-green);
      background: rgba(43, 182, 115, 0.08);
      border-radius: 20px;
      padding: 6px 12px;
    }

    .weather-badge::before {
      content: "↻";
      font-size: 0.95rem;
      display: inline-block;
      transform: rotate(40deg);
    }

    .weather-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0 8px;
      font-size: 0.98rem;
      color: var(--text-main);
      font-weight: 700;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success-green);
      box-shadow: 0 0 0 3px rgba(43, 182, 115, 0.18);
    }

    .weather-body {
      margin-top: 6px;
      color: var(--text-sub);
      line-height: 1.8;
      font-size: 0.95rem;
    }

    .status-safe {
      color: #1d9d58;
    }

    .status-advisory {
      color: #d79d00;
    }

    .status-warning {
      color: #d62828;
    }

    .weather-body .small {
      color: #5a6d7e;
    }

    @media (max-width: 640px) {
      .app-header {
        padding: 0 18px;
      }

      .weather-header {
        flex-direction: column;
        align-items: flex-start;
      }

      #shelterMap {
        height: 320px;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="/" class="app-brand">防災アプリ</a>
    <button class="app-menu" aria-label="メニュー"><span></span></button>
  </header>

  <nav class="top-nav">
    <a href="/">ホーム</a>
    <a href="/shelter_search">避難所検索</a>
    <a href="/shelter_register">避難所登録</a>
    <a href="/board">指示・発信ボード</a>
    {% if session.logged_in %}
      <a href="/logout">ログアウト</a>
    {% else %}
      <a href="/login">ログイン</a>
    {% endif %}
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
